services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./database:/app/database
      - ./uploads:/app/uploads
    environment:
      APP_CHECKPOINT_PATH: /app/models/best_model.pt
      APP_DEVICE: cpu
      APP_CORS_ORIGINS: '["http://localhost:5173"]'

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend
